[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is a formatting nit, not a correctness issue
    "UP042", # (str, Enum) is intentional: predates StrEnum and keeps JSON/Pydantic behaviour explicit
]

[tool.ruff.lint.isort]
known-first-party = ["app", "cli"]
